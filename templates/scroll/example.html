<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пример: видео при прокрутке</title>
  <link rel="stylesheet" href="scroll-frames.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f1115; color: #f4f4f5; }
    .screen { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    h1 { font-size: clamp(28px, 5vw, 56px); margin: 0; text-align: center; max-width: 18ch; }
    .hint { color: #a1a1aa; font-size: 15px; text-align: center; max-width: 40ch; }
  </style>
</head>
<body>
  <div class="screen"><p class="hint">Прокрутите страницу вниз: кадры сменяются ровно по движению колеса.</p></div>

  <section class="mgen-scroll" data-frames="frames/frame-$.jpg" data-count="150" data-pad="4">
    <div class="mgen-scroll__sticky">
      <canvas class="mgen-scroll__canvas"></canvas>
      <img class="mgen-scroll__fallback" src="frames/frame-0001.jpg" alt="Кадр из видео">
      <div class="mgen-scroll__overlay"><h1>Заголовок поверх кадров</h1></div>
    </div>
  </section>

  <div class="screen"><p class="hint">Дальше идёт обычная страница.</p></div>

  <script src="scroll-frames.js"></script>
</body>
</html>
